<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Contact Me</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <nav>

        <div class="logo">
            My Biodata
        </div>

        <ul>

            <li>
                <a href="index.html">Profile</a>
            </li>

            <li>
                <a href="Hobbies.html">Hobbies</a>
            </li>

            <li>
                <a href="Academic_Record.html">
                    Academic Record
                </a>
            </li>

            <li>
                <a href="Contact_Me.html">
                    Contact Me
                </a>
            </li>

        </ul>

    </nav>


    <section>

        <h2 class="section-title">
            Contact Me
        </h2>


        <div class="contact-container">

            <form>

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                    >

                </div>


                <div class="form-group">

                    <label for="category">
                        Message Category
                    </label>

                    <select id="category">

                        <option>
                            General
                        </option>

                        <option>
                            Academic
                        </option>

                        <option>
                            Personal
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        placeholder="Write your message..."
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="submit-btn"
                >
                    Send Message
                </button>

            </form>

        </div>

    </section>


    <footer>

        <p>© 2026 My Biodata</p>

        <p>Web Programming</p>

    </footer>

</body>

</html>
